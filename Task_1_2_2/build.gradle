plugins {
    id 'java'
    id 'jacoco'
}

group = 'hashmap'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0') // Поправили актуальную стабильную версию JUnit 5 BOM
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

jacocoTestReport {
    dependsOn test // Отчет строится только после успешного прогона тестов
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

javadoc {
    options.encoding = 'UTF-8'
    destinationDir = file("$buildDir/docs/javadoc")
}